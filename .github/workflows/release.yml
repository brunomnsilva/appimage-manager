name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish (e.g. v1.0.0)
        required: true

permissions:
  contents: write

env:
  REF: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$REF" in
            v*) ;;
            *)
              echo "Tag must start with 'v': $REF" >&2
              exit 1
              ;;
          esac

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Set up shfmt
        uses: mfinelli/setup-shfmt@v3

      - name: Lint, format check, bundle, and test
        run: make test

      - name: Generate checksums
        run: (cd dist && sha256sum appimage-manager.sh appimage-manager-tui.sh > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$REF" >/dev/null 2>&1; then
            gh release upload "$REF" dist/* --clobber
          else
            gh release create "$REF" dist/* --generate-notes --title "$REF"
          fi
